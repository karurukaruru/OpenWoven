<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenWoven</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><h1 id="title">OpenWoven</h1><button id="settingsToggle" data-i18n="settings">设置</button></header>
<section id="chat" aria-live="polite"></section><form id="composer"><textarea id="draft" rows="2" maxlength="12000" aria-label="Message"></textarea><button id="send" data-i18n="send">发送</button></form><p id="error" role="alert"></p>
<section id="settings" hidden><h2 data-i18n="settings">设置</h2>
<p data-i18n="disclosure">OpenWoven 是 AI 聊天软件；角色经历属于虚构设定。数据保存在本机，调用模型会将相关上下文发送给服务商。</p>
<form id="provider"><label><span data-i18n="language">语言</span><select id="language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="ja">日本語</option><option value="en-US">English (US)</option></select></label>
<label><span data-i18n="endpoint">接口地址</span><input id="endpoint" type="url" required></label><label><span data-i18n="model">模型名称</span><input id="model" maxlength="120"></label><label>API Key<input id="key" type="password" autocomplete="off" maxlength="4096"></label>
<p data-i18n="keyHelp">Key 仅保留在这次服务进程的内存中，重启后需重新填写；不填使用离线示例回复。</p>
<label><span data-i18n="wait">停止输入后等待（10–60 秒）</span><input id="wait" type="number" min="10" max="60" value="20"></label><button data-i18n="save">保存</button></form><button id="offline" data-i18n="offline">清除 Key，使用离线演示</button>
<h2 data-i18n="roles">角色管理</h2><p data-i18n="privacy">角色包只含角色设定与经历，不含用户画像、聊天记录或 Key。各角色记忆独立，未选中的角色暂停发送。</p><div id="roles"></div>
<label><span data-i18n="import">导入 ZIP / JSON / PNG 角色卡</span><input id="import" type="file" accept=".zip,.json,.png"></label><section id="preview" hidden><pre id="previewText"></pre><button id="confirmImport" data-i18n="confirm">确认导入</button><button id="cancelImport" data-i18n="cancel">取消</button></section>
<form id="newRole"><label><span data-i18n="name">昵称</span><input id="name" maxlength="40" required></label><label><span data-i18n="description">角色设定</span><textarea id="description" maxlength="600" required></textarea></label><button data-i18n="create">新建角色</button></form>
<h2 data-i18n="schedule">预约消息</h2><p data-i18n="scheduleHelp">需保持本地服务运行；页面关闭后仍会保存消息，下次打开可查看。当前网页版本不提供系统通知。</p><form id="schedule"><input id="when" type="datetime-local" required><textarea id="scheduledText" maxlength="600" required></textarea><label><input id="generate" type="checkbox"><span data-i18n="generate">让模型按这个话题生成</span></label><button data-i18n="schedule">预约消息</button></form><ul id="scheduled"></ul>
<button id="memoryButton" data-i18n="memory">查看用户偏好与周摘要</button><pre id="memory"></pre></section></main></body></html>
